spring:
  application:
    name: ms-digitalfix-workorders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:DFX_WORKORDERS}
    password: ${ORACLE_WORKORDERS_PASSWORD:digitalfix}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: workorders-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

amqp:
  exchange:
    negocio: ordenes.negocio.exchange
  routing-key:
    eventos: ordenes.eventos.v1

server:
  port: ${PUERTO:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacion:-sin-correlacion}] %logger{36} - %msg%n"